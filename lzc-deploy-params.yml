params:
  - id: manager_pw
    type: secret
    name: "主持人（Manager）密码"
    description: "解锁主持人界面的密码，用于创建与运行答题游戏。已预置随机值，可在部署时修改。"
    default_value: "Rz7qWm3kPv9xDc2s"
    optional: false
  - id: jwt_secret
    type: secret
    name: "会话签名密钥"
    description: "签名会话令牌。已预置随机值且跨重启稳定；重建容器不会把玩家全体登出。"
    default_value: "3f8a1c6e9d2b5a8c4f7e0b3d6a9c2f5e"
    optional: false

locales:
  zh:
    manager_pw:
      name: "主持人（Manager）密码"
      description: "解锁主持人界面的密码（已预置随机值，可修改）"
    jwt_secret:
      name: "会话签名密钥"
      description: "签名会话令牌（已预置随机值，跨重启稳定）"
  en:
    manager_pw:
      name: "Manager password"
      description: "Password that unlocks the manager interface (random default, editable)."
    jwt_secret:
      name: "Session secret"
      description: "Signs session tokens (random default, stable across restarts)."

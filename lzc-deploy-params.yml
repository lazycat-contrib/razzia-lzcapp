params:
  - id: manager_password
    type: secret
    name:
      zh: "主持人（Manager）密码"
      en: "Manager password"
    description:
      zh: "解锁主持人界面的密码，用于创建与运行答题游戏。默认已随机生成，可在部署时修改。"
      en: "Password that unlocks the manager interface. A random value is generated by default."
    default_value: "Rz7qWm3kPv9xDc2s"
  - id: jwt_secret
    type: secret
    name:
      zh: "会话签名密钥"
      en: "JWT session secret"
    description:
      zh: "签名会话令牌。随机生成且跨重启稳定；重建容器不会把玩家全体登出。"
      en: "Signs session tokens. Stable across restarts so sessions survive rebuilds."
    default_value: "3f8a1c6e9d2b5a8c4f7e0b3d6a9c2f5e"
